[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "tigressrtl"
version = "0.1.0"
description = "An agent that generates, writes, and compiles SystemVerilog RTL."
requires-python = ">=3.10"
dependencies = [
    "langchain-core",
    "langchain-ollama",
    "pyyaml",
]

[project.optional-dependencies]
# Install with `pip install -e ".[dev]"` to run the unit suite in test/.
dev = ["pytest"]

[tool.setuptools]
py-modules = ["model", "tools", "rtl_agent", "config"]

[tool.setuptools.package-dir]
"" = "src"

[tool.pytest.ini_options]
testpaths = ["test"]
# run_benchmark.py / run_validation.py live in test/ too, but they are
# harnesses that drive a real model, not unit tests — only test_*.py files
# are collected, so a bare `pytest` never tries to run them.
python_files = ["test_*.py"]
