# Default settings for the RTL agent — see src/config.py's AgentConfig for
# field docs and rationale. Copy this file to make an experiment-specific
# config (e.g. configs/llama3.2-fast.yaml) and pass it via --config.

# Options verified to work with this agent (see README.md in this
# directory for context limits and tool-calling reliability notes):
#   devstral (default), devstral-small-2, llama3.2, qwen2.5-coder
# Not usable: llama2 (no tool-calling support at all).
# model: devstral
model: devstral-small-2
num_ctx: 8192
max_build_retries: 3

# Which build/lint backend the agent's build tool uses: "icarus" (Icarus
# Verilog, a real compiler) or "slang" (sv-lang.com, a stricter linter —
# see configs/README.md for what -Weverything catches that Icarus misses).
# Exactly one is bound to the model at a time, never both.
verilog_build_tool: icarus
