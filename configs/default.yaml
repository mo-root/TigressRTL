# Default settings for the RTL agent — see src/config.py's AgentConfig for
# field docs and rationale. Copy this file to make an experiment-specific
# config (e.g. configs/llama3.2-fast.yaml) and pass it via --config.

# Options verified to work with this agent (see README.md in this
# directory for context limits and tool-calling reliability notes):
