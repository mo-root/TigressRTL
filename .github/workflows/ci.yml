# Runs the unit suite on every push and pull request. Deliberately needs no
# GPU, no Ollama, no pulled model, no Icarus/Slang and no verilog-eval clone:
# test/test_units.py covers only the logic that is deterministic without a
# toolchain, so a reviewer can see a change is sound without reproducing the
# full setup. The integration harnesses (test/run_benchmark.py,
# test/run_validation.py) still need all of that and are not run here.
name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .
      - name: Unit tests
        run: python -m unittest discover -s test -p 'test_*.py' -v
